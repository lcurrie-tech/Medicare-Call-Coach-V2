name: Deploy AEP Leaderboard

on:
  push:
    branches: [main]
    paths:
      - "aep-leaderboard/**"
      - ".github/workflows/aep-leaderboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "aep-leaderboard-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload leaderboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./aep-leaderboard"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
